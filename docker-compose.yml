services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderflow}
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d ${POSTGRES_DB:-orderflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://orderflow:orderflow@db:5432/orderflow}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://127.0.0.1:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      YANDEXGPT_API_KEY: ${YANDEXGPT_API_KEY:-}
      YANDEXGPT_FOLDER_ID: ${YANDEXGPT_FOLDER_ID:-}
      YANDEXGPT_MODEL_NAME: ${YANDEXGPT_MODEL_NAME:-yandexgpt-lite}
      YANDEXGPT_MODEL_URI: ${YANDEXGPT_MODEL_URI:-}
      YANDEXGPT_API_URL: ${YANDEXGPT_API_URL:-https://llm.api.cloud.yandex.net/foundationModels/v1/completion}
      YANDEXGPT_TIMEOUT: ${YANDEXGPT_TIMEOUT:-30}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru/api/v1/chat/completions}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BPIUM_BASE_URL: ${BPIUM_BASE_URL:-}
      BPIUM_LOGIN: ${BPIUM_LOGIN:-}
      BPIUM_PASSWORD: ${BPIUM_PASSWORD:-}
      BPIUM_CATALOG_ID: ${BPIUM_CATALOG_ID:-}
      BPIUM_API_PREFIX: ${BPIUM_API_PREFIX:-/api/v1}
      BPIUM_TIMEOUT: ${BPIUM_TIMEOUT:-15}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET: ${YOOKASSA_SECRET:-}
      DELIVERY_TARIFFS_JSON: ${DELIVERY_TARIFFS_JSON:-}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-imap.gmail.com}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_IMAP_MAILBOX: ${EMAIL_IMAP_MAILBOX:-INBOX}
      EMAIL_LOGIN: ${EMAIL_LOGIN:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-postgresql://orderflow:orderflow@db:5432/orderflow}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://127.0.0.1:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      YANDEXGPT_API_KEY: ${YANDEXGPT_API_KEY:-}
      YANDEXGPT_FOLDER_ID: ${YANDEXGPT_FOLDER_ID:-}
      YANDEXGPT_MODEL_NAME: ${YANDEXGPT_MODEL_NAME:-yandexgpt-lite}
      YANDEXGPT_MODEL_URI: ${YANDEXGPT_MODEL_URI:-}
      YANDEXGPT_API_URL: ${YANDEXGPT_API_URL:-https://llm.api.cloud.yandex.net/foundationModels/v1/completion}
      YANDEXGPT_TIMEOUT: ${YANDEXGPT_TIMEOUT:-30}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_AUTH_URL: ${GIGACHAT_AUTH_URL:-https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      GIGACHAT_API_URL: ${GIGACHAT_API_URL:-https://gigachat.devices.sberbank.ru/api/v1/chat/completions}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BPIUM_BASE_URL: ${BPIUM_BASE_URL:-}
      BPIUM_LOGIN: ${BPIUM_LOGIN:-}
      BPIUM_PASSWORD: ${BPIUM_PASSWORD:-}
      BPIUM_CATALOG_ID: ${BPIUM_CATALOG_ID:-}
      BPIUM_API_PREFIX: ${BPIUM_API_PREFIX:-/api/v1}
      BPIUM_TIMEOUT: ${BPIUM_TIMEOUT:-15}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET: ${YOOKASSA_SECRET:-}
      DELIVERY_TARIFFS_JSON: ${DELIVERY_TARIFFS_JSON:-}
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-imap.gmail.com}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_IMAP_MAILBOX: ${EMAIL_IMAP_MAILBOX:-INBOX}
      EMAIL_LOGIN: ${EMAIL_LOGIN:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    volumes:
      - ./backend:/app
    command: >
      sh -c "if [ -z \"$${TELEGRAM_BOT_TOKEN}\" ]; then
               echo 'TELEGRAM_BOT_TOKEN is not set, bot container is idle.';
               sleep infinity;
             else
               python manage.py run_bot;
             fi"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

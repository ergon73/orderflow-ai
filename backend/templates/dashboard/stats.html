<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrderFlow Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f4f7fb; color: #1f2a3c; }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
      .card { background: #fff; border: 1px solid #e4e7ee; border-radius: 10px; padding: 14px; }
      a { color: #0d6efd; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <p><a href="/dashboard/orders/">← К заказам</a></p>
      <h1>Статистика заказов</h1>
      <div class="grid">
        <div class="card"><canvas id="statusChart"></canvas></div>
        <div class="card"><canvas id="channelChart"></canvas></div>
        <div class="card" style="grid-column: 1 / -1;"><canvas id="dayChart"></canvas></div>
      </div>
    </div>
    <script>
      const statusStats = {{ status_stats|safe }};
      const channelStats = {{ channel_stats|safe }};
      const dayStats = {{ day_stats|safe }};

      new Chart(document.getElementById("statusChart"), {
        type: "bar",
        data: {
          labels: statusStats.map(s => s.status),
          datasets: [{ label: "По статусам", data: statusStats.map(s => s.total) }]
        }
      });

      new Chart(document.getElementById("channelChart"), {
        type: "doughnut",
        data: {
          labels: channelStats.map(s => s.channel),
          datasets: [{ label: "По каналам", data: channelStats.map(s => s.total) }]
        }
      });

      new Chart(document.getElementById("dayChart"), {
        type: "line",
        data: {
          labels: dayStats.map(s => s.day),
          datasets: [{ label: "По дням", data: dayStats.map(s => s.total), tension: 0.2 }]
        }
      });
    </script>
  </body>
</html>
